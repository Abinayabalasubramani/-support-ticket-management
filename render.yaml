# Render Blueprint for the API. The frontend is deployed separately on Vercel.
# `prisma` is a regular dependency so the migration step works on the production build.
services:
  - type: web
    name: support-ticket-api
    runtime: node
    region: ohio # same region as the Neon database (us-east-2) to keep queries fast
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # pooled Neon URL, add &connect_timeout=15 for cold starts
        sync: false
      - key: DIRECT_URL # direct (non-pooler) Neon URL, used by migrations
        sync: false
      - key: CORS_ORIGIN # the Vercel URL, e.g. https://your-app.vercel.app
        sync: false
